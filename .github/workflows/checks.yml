name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/01_get_pubmed_metadata.py --self-test
      - run: python scripts/01_get_pubmed_metadata.py --plan-only
      - run: |
          for script in scripts/[0-9][0-9]_*.py demo/scripts/[0-9][0-9]_*.py; do
            python "$script" --help
          done
