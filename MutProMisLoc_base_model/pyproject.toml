[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MutProMisLoc_base_model"
version = "0.1.0"
description = "ESM-2 difference Conv1D/Transformer baseline for paired protein mutations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.3",
    "scikit-learn==1.6.1",
    "torch==2.5.1",
    "fair-esm==2.0.0",
]

[project.scripts]
mutpromisloc = "mutpromisloc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
